[project]
name = "wentian"
version = "0.14.0"
description = "A terminal AI coding assistant — streaming multi-model REPL with Agent Loop, permission system, MCP client, and Skills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ai", "llm", "cli", "repl", "agent", "mcp", "anthropic", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/yuningdev/wentiancode"
Repository = "https://github.com/yuningdev/wentiancode"

dependencies = [
    "anthropic",
    "openai",
    "typer",
    "rich",
    "pyyaml",
    "prompt_toolkit",
]

[project.scripts]
wentian = "wentian.cli:app"
wt = "wentian.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/wentian"]
# v0.11 · C107a · F73（任务 T134a）— 内置 Skill 的 *.md 是包数据，须随 wheel 分发，
# 否则 importlib.resources.files("wentian.skills")/"builtin" 在安装态下读不到。
artifacts = ["src/wentian/skills/builtin/*.md"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wentian",
    "tests",
]
artifacts = ["src/wentian/skills/builtin/*.md"]
