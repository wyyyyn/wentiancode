[project]
name = "wentian"
version = "0.13.0"
description = "A terminal AI assistant REPL"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "typer",
    "rich",
    "pyyaml",
    "prompt_toolkit",
]

[project.scripts]
wentian = "wentian.cli:app"
wt = "wentian.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wentian"]
# v0.11 · C107a · F73（任务 T134a）— 内置 Skill 的 *.md 是包数据，须随 wheel 分发，
# 否则 importlib.resources.files("wentian.skills")/"builtin" 在安装态下读不到。
artifacts = ["src/wentian/skills/builtin/*.md"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wentian",
    "tests",
]
artifacts = ["src/wentian/skills/builtin/*.md"]
