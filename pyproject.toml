[project]
name = "wentian"
version = "0.10.0"
description = "A terminal AI assistant REPL"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "typer",
    "rich",
    "pyyaml",
    "prompt_toolkit",
]

[project.scripts]
wentian = "wentian.cli:app"
wt = "wentian.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wentian"]
